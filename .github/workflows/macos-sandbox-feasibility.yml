name: macOS SPIKE Renode App Sandbox qualification

# Builds this Runtime commit as the multi-file SPIKE Renode layout for macOS
# (macos-spike-renode.yml) and probes it in minimal ad-hoc signed, sandboxed,
# Tauri-shaped bundles (sandboxed launcher -> app-sandbox + inherit Renode child)
# booting the project's own source-built NuttX simulation guest. Also boots the
# same guest on Linux with and without the opt-in shipped tlib file and loopback
# bind, so Linux behaviour stays qualified. No reference or original LEGO
# firmware is used, fetched or bundled. Not a release or App Store build.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/macos-sandbox-feasibility.yml'
      - '.github/workflows/macos-spike-renode.yml'
      - 'src/Infrastructure'

permissions:
  contents: read

concurrency:
  group: macos-sandbox-feasibility-${{ github.ref }}
  cancel-in-progress: false

env:
  RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RESOURCES_SHA: 14b80cde0a136b684f316eb7f6a31aeaae0684bf
  FIRMWARE_SHA: 91cf0c07784441ac114b85a1705737327db2d9f8
  LITE_SHA: 8bf40b2c3d29014219bb591b66cc27b43afca7a5

jobs:
  own-guest:
    name: Source-built own NuttX simulation guest (Linux producer)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out own firmware
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: CrispStrobe/brickwright-spike-prime-fw
          ref: ${{ env.FIRMWARE_SHA }}
          path: firmware
          persist-credentials: false
      - name: Check out pinned Runtime (platforms, models, state service)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RUNTIME_SHA }}
          path: runtime
          persist-credentials: false
      - name: Check out Lite package producer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: CrispStrobe/brickwright-lite
          ref: ${{ env.LITE_SHA }}
          path: lite
          sparse-checkout: scripts
          persist-credentials: false
      - name: Pin Infrastructure gitlink
        working-directory: runtime
        run: |
          git submodule update --init --depth 1 src/Infrastructure
          test "$(git -C src/Infrastructure rev-parse HEAD)" = "$(git ls-tree HEAD src/Infrastructure | awk '{print $3}')"
      - name: Initialize firmware gitlinks and apply reviewed backports
        working-directory: firmware
        run: |
          git submodule update --init nuttx nuttx-apps
          python3 tools/apply_nuttx_backports.py
      - name: Build the pinned tool container
        working-directory: firmware
        run: docker build --pull -t nuttx-builder -f docker/Dockerfile.nuttx docker
      # Only the TI-free simulation profile; the hardware profile is never built.
      - name: Build own NuttX firmware (simulation profile)
        working-directory: firmware
        run: |
          set -o pipefail
          make nuttx BOARD_CONFIG=simulation V=1 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 20
      - name: Gate the simulation image and build as TI-free
        working-directory: firmware
        run: |
          python3 tools/check_ti_free_image.py \
            nuttx/nuttx.bin nuttx/nuttx_user.bin nuttx/nuttx nuttx/nuttx_user.elf \
            --build-log "$RUNNER_TEMP/build.log" \
            --build-root nuttx --build-root nuttx-apps --build-root apps \
            --config nuttx/.config --elf nuttx/nuttx_user.elf
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Stage the package through the existing Lite producer (compiled models)
        run: |
          sudo apt-get update -q
          sudo apt-get install --no-install-recommends -y -q binutils-arm-none-eabi
          # The producer only hashes this path into its pins file; the probe
          # replaces the Runtime with the macOS build and ignores that pin.
          printf 'placeholder\n' > "$RUNNER_TEMP/runtime-placeholder"
          # Compiled models: this Runtime already contains the Prime models, so
          # including models.cs fails (first probe run 40308804034).
          node lite/scripts/prepare-spike-nuttx-package.mjs \
            firmware runtime runtime/src/Infrastructure "$RUNNER_TEMP/runtime-placeholder" \
            /tmp/bwprobe/nuttx --compiled-models
          ! grep -q models.cs /tmp/bwprobe/nuttx/nuttx.resc
          cd /tmp/bwprobe/nuttx && find . -type f | sort | xargs shasum -a 256 > ../package-sha256.txt
          cp ../package-sha256.txt nuttx-package-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: own-nuttx-package
          path: /tmp/bwprobe/nuttx
          if-no-files-found: error
          retention-days: 14

  linux-qualification:
    name: Linux boot with and without shipped tlib and loopback bind
    needs: own-guest
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out exact Runtime
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RUNTIME_SHA }}
          submodules: recursive
          persist-credentials: false
      - name: Pin the reviewed support libraries
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: renode/renode-resources
          ref: ${{ env.RESOURCES_SHA }}
          path: lib/resources
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Build headless Runtime
        run: |
          set -o pipefail
          git submodule foreach --recursive 'test "$(git rev-parse HEAD)" = "$sha1"'
          ./build.sh --net --no-gui --skip-fetch 2>&1 | tail -n 20
          test -s src/Infrastructure/src/Emulator/Cores/bin/Release/lib/translate-arm-m-le.so
      - name: Unit tests for shipped tlib and bind address
        run: |
          set -o pipefail
          dotnet test src/Infrastructure/src/Emulator/Main/Tests/UnitTests/UnitTests_NET.csproj -c Release \
            --filter "FullyQualifiedName~ShippedTranslationLibrariesTests|FullyQualifiedName~SocketServerBindAddressTests" 2>&1 | tail -n 30
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: own-nuttx-package
          path: /tmp/bwprobe/nuttx
      - name: Write probe client
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tools"
          cat > "$RUNNER_TEMP/tools/client.py" <<'PY'
          import json, socket, sys, time
          state_port, monitor_port, timeout, out = int(sys.argv[1]), int(sys.argv[2]), float(sys.argv[3]), sys.argv[4]
          def snapshot(deadline):
              while time.time() < deadline:
                  try:
                      s = socket.create_connection(('127.0.0.1', state_port), timeout=5)
                  except OSError:
                      time.sleep(0.5); continue
                  s.settimeout(60); buf = b''
                  while b'\n' not in buf:
                      chunk = s.recv(65536)
                      if not chunk: break
                      buf += chunk
                  s.close()
                  if b'\n' in buf: return json.loads(buf.split(b'\n', 1)[0])
              return None
          def summarize(snap):
              if snap is None: return None
              d = snap.get('display') or {}
              px = d.get('pixels')
              lit = sum(1 for v in px if v) if isinstance(px, list) else (len(px.strip('0')) if isinstance(px, str) else None)
              return {'type': snap.get('type'), 'clockNs': snap.get('clockNs'), 'firmware': (snap.get('target') or {}).get('firmware'),
                      'display': [d.get('width'), d.get('height')], 'litPixels': lit,
                      'lifecycleKeys': sorted((snap.get('lifecycle') or {}).keys()),
                      'motors': len(snap.get('motors') or []), 'power': snap.get('power')}
          def monitor(cmd):
              s = socket.create_connection(('127.0.0.1', monitor_port), timeout=10)
              s.settimeout(300 if cmd != 'quit' else 3); s.sendall((cmd + '\n').encode())
              data = b''
              try:
                  while True:
                      chunk = s.recv(65536)
                      if not chunk: break
                      data += chunk
                      if cmd == 'quit' or data.count(b'(machine-0)') >= 2: break
              except socket.timeout:
                  pass
              s.close(); return data
          start = time.time()
          first = snapshot(start + timeout)
          result = {'firstSnapshotSeconds': round(time.time() - start, 1) if first else None, 'first': summarize(first)}
          if not first:
              try: result['monitorOnFailure'] = monitor('mach').decode('utf-8', 'replace')[-6000:]
              except OSError as e: result['monitorError'] = str(e)
          if first:
              try:
                  monitor('emulation RunFor "4.0"'); time.sleep(2)
                  result['second'] = summarize(snapshot(time.time() + 120))
              except OSError as e:
                  result['secondError'] = str(e)
          try: monitor('quit')
          except OSError: pass
          json.dump(result, open(out, 'w'), indent=2)
          print(json.dumps(result))
          sys.exit(0 if first else 1)
          PY
      - name: Boot the own guest three ways
        run: |
          set +e -u
          T="$RUNNER_TEMP"; R="$T/results"; mkdir -p "$R"; res=/tmp/bwprobe/nuttx
          stack=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["boot"]["stack"])' "$res/state-config.json")
          reset=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["boot"]["reset"])' "$res/state-config.json")
          LIB="$GITHUB_WORKSPACE/src/Infrastructure/src/Emulator/Cores/bin/Release/lib"
          mkdir -p "$T/tlib"; cp "$LIB/translate-arm-m-le.so" "$T/tlib/"
          fail=0
          for v in default shipped-tlib loopback; do
            mkdir -p "$R/$v"; envs=()
            case $v in shipped-tlib) envs=(RENODE_TLIB_DIRECTORY="$T/tlib");; loopback) envs=(RENODE_TLIB_DIRECTORY="$T/tlib" RENODE_SERVER_BIND_ADDRESS=127.0.0.1);; esac
            ( cd "$res" && exec env ${envs[@]+"${envs[@]}"} "$GITHUB_WORKSPACE/renode" --disable-gui -P 39554 \
                -e "include @$res/nuttx.resc" -e "sysbus LoadELF @$res/nuttx-user.elf" -e "sysbus LoadELF @$res/nuttx-kernel.elf" \
                -e 'cpu VectorTableOffset 0x08008000' -e "cpu SP $stack" -e "cpu PC $reset" -e 'emulation RunFor "1.0"' \
                -e "include @$res/scripts/spike-state-server.py" -e "spike_state_start \"127.0.0.1\" 39555 @$res/state-config.json" \
                > "$R/$v/renode.log" 2>&1 ) & pid=$!
            sleep 5; ss -ltnp 2>/dev/null | grep -E ':3955[45]' > "$R/$v/listen.txt"
            python3 "$T/tools/client.py" 39555 39554 240 "$R/$v/client.json" > "$R/$v/client.out" 2>&1; crc=$?
            ss -ltn | grep -E ':3955[45]' >> "$R/$v/listen.txt"
            for i in $(seq 1 30); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            kill -0 $pid 2>/dev/null && { kill -TERM $pid; sleep 3; kill -KILL $pid 2>/dev/null; }
            wait $pid
            # ./renode is a shell wrapper around dotnet: stop whatever still owns
            # this variant's ports (run 40457986283 reused a surviving process).
            sudo fuser -k -TERM -n tcp 39554 39555 2>/dev/null; sleep 3; sudo fuser -k -KILL -n tcp 39554 39555 2>/dev/null
            for i in $(seq 1 20); do ss -ltn | grep -q -E ':3955[45] ' || break; sleep 1; done
            ! ss -ltn | grep -q -E ':3955[45] ' || { echo "ports still busy after $v"; fail=1; }
            shipped=$(grep -c 'Using shipped translation library' "$R/$v/renode.log")
            echo "== $v client=$crc shippedLines=$shipped"; cat "$R/$v/client.out"; sort -u "$R/$v/listen.txt"
            [ $crc = 0 ] || fail=1
            case $v in default) [ "$shipped" = 0 ] || fail=1;; *) [ "$shipped" -ge 1 ] || fail=1;; esac
            case $v in loopback) grep -q '127.0.0.1:39554' "$R/$v/listen.txt" && ! grep -q '0.0.0.0:39554' "$R/$v/listen.txt" || fail=1;;
                       default) grep -q '0.0.0.0:39554' "$R/$v/listen.txt" || fail=1;; esac
          done
          # The shipped file must survive the CPU's disposal.
          test -s "$T/tlib/translate-arm-m-le.so" || fail=1
          exit $fail
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-qualification
          path: ${{ runner.temp }}/results
          retention-days: 14

  renode-macos:
    uses: ./.github/workflows/macos-spike-renode.yml
    with:
      runtime_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  sandbox-probe:
    name: App Sandbox probe ${{ matrix.rid }}
    needs: [own-guest, renode-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-14, rid: osx-arm64}
          - {runner: macos-15-intel, rid: osx-x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: renode-spike-macos-${{ matrix.rid }}
          path: ${{ runner.temp }}/renode
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: own-nuttx-package
          path: ${{ runner.temp }}/nuttx
      - name: Write probe tools
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tools"
          cat > "$RUNNER_TEMP/tools/client.py" <<'PY'
          import json, socket, sys, time
          state_port, monitor_port, timeout, out = int(sys.argv[1]), int(sys.argv[2]), float(sys.argv[3]), sys.argv[4]
          def snapshot(deadline):
              while time.time() < deadline:
                  try:
                      s = socket.create_connection(('127.0.0.1', state_port), timeout=5)
                  except OSError:
                      time.sleep(0.5); continue
                  s.settimeout(60); buf = b''
                  while b'\n' not in buf:
                      chunk = s.recv(65536)
                      if not chunk: break
                      buf += chunk
                  s.close()
                  if b'\n' in buf: return json.loads(buf.split(b'\n', 1)[0])
              return None
          def summarize(snap):
              if snap is None: return None
              d = snap.get('display') or {}
              px = d.get('pixels')
              lit = sum(1 for v in px if v) if isinstance(px, list) else (len(px.strip('0')) if isinstance(px, str) else None)
              return {'type': snap.get('type'), 'clockNs': snap.get('clockNs'), 'firmware': (snap.get('target') or {}).get('firmware'),
                      'display': [d.get('width'), d.get('height')], 'litPixels': lit,
                      'lifecycleKeys': sorted((snap.get('lifecycle') or {}).keys()),
                      'motors': len(snap.get('motors') or []), 'power': snap.get('power')}
          def monitor(cmd):
              s = socket.create_connection(('127.0.0.1', monitor_port), timeout=10)
              s.settimeout(300 if cmd != 'quit' else 3); s.sendall((cmd + '\n').encode())
              data = b''
              try:
                  while True:
                      chunk = s.recv(65536)
                      if not chunk: break
                      data += chunk
                      if cmd == 'quit' or data.count(b'(machine-0)') >= 2: break
              except socket.timeout:
                  pass
              s.close(); return data
          start = time.time()
          first = snapshot(start + timeout)
          result = {'firstSnapshotSeconds': round(time.time() - start, 1) if first else None, 'first': summarize(first)}
          if not first:
              try: result['monitorOnFailure'] = monitor('mach').decode('utf-8', 'replace')[-6000:]
              except OSError as e: result['monitorError'] = str(e)
          if first:
              try:
                  monitor('emulation RunFor "4.0"'); time.sleep(2)
                  result['second'] = summarize(snapshot(time.time() + 120))
              except OSError as e:
                  result['secondError'] = str(e)
          try: monitor('quit')
          except OSError: pass
          json.dump(result, open(out, 'w'), indent=2)
          print(json.dumps(result))
          sys.exit(0 if first else 1)
          PY
          cat > "$RUNNER_TEMP/tools/launcher.c" <<'C'
          // Minimal sandboxed parent: spawns the bundled Renode child, as the
          // Tauri app would, and waits for it.
          #include <spawn.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/wait.h>
          #include <mach-o/dyld.h>
          #include <libgen.h>
          extern char **environ;
          int main(int argc, char **argv) {
              char self[4096]; uint32_t n = sizeof self;
              if (_NSGetExecutablePath(self, &n) != 0) return 90;
              char child[4200]; snprintf(child, sizeof child, "%s/../Resources/renode/renode", dirname(self));
              argv[0] = child; pid_t pid;
              int rc = posix_spawn(&pid, child, NULL, NULL, argv, environ);
              if (rc != 0) { fprintf(stderr, "posix_spawn failed: %s\n", strerror(rc)); return 91; }
              int status; waitpid(pid, &status, 0);
              if (WIFSIGNALED(status)) { fprintf(stderr, "child signal %d\n", WTERMSIG(status)); return 128 + WTERMSIG(status); }
              return WEXITSTATUS(status);
          }
          C
          clang -O2 -o "$RUNNER_TEMP/tools/launcher" "$RUNNER_TEMP/tools/launcher.c"
      - name: Unpack the SPIKE layout
        run: |
          set -eu
          tar -xzf "$RUNNER_TEMP/renode/renode-spike-macos-${{ matrix.rid }}.tar.gz" -C "$RUNNER_TEMP/renode"
          cat "$RUNNER_TEMP/renode/provenance.json"; cat "$RUNNER_TEMP/renode/licenses.txt" | tr '\n' ' '; echo
          test -s "$RUNNER_TEMP/renode/renode/tlib/translate-arm-m-le.so"
          test ! -e "$RUNNER_TEMP/renode/renode/PacketDotNet.dll"
      - name: Run variants
        run: |
          set +e -u
          T="$RUNNER_TEMP"; R="$T/results"; mkdir -p "$R"
          STATE_PORT=39555; MON_PORT=39554
          ent() { f="$T/ent-$1.plist"; shift
            { echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict>'
              for k in "$@"; do echo "<key>$k</key><true/>"; done; echo '</dict></plist>'; } > "$f"; echo "$f"; }
          bundle() { # variant bundleid
            app="$T/apps/$1/SpikeProbe.app"; rm -rf "$T/apps/$1"; mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            ditto "$T/renode/renode" "$app/Contents/Resources/renode"
            ditto "$T/nuttx" "$app/Contents/Resources/nuttx"
            cp "$T/tools/launcher" "$app/Contents/MacOS/launcher"
            res="$app/Contents/Resources/nuttx"
            grep -rIl '/tmp/bwprobe/nuttx' "$res" | while read -r f; do sed -i '' "s#/tmp/bwprobe/nuttx#$res#g" "$f"; done
            cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleIdentifier</key><string>$2</string><key>CFBundleExecutable</key><string>launcher</string>
          <key>CFBundlePackageType</key><string>APPL</string><key>CFBundleName</key><string>SpikeProbe</string><key>LSMinimumSystemVersion</key><string>12.0</string></dict></plist>
          EOF
            echo "$app"; }
          signall() { # app id child-ent parent-ent runtime
            app=$1; o=(); [ "$5" = 1 ] && o=(-o runtime)
            find "$app/Contents/Resources/renode" -type f ! -path '*/renode/renode' -print0 | while IFS= read -r -d '' f; do
              file -b "$f" | grep -q '^Mach-O' && codesign --force -s - ${o[@]+"${o[@]}"} "$f" >/dev/null 2>&1; done
            codesign --force -s - ${o[@]+"${o[@]}"} --identifier "$2" --entitlements "$3" "$app/Contents/Resources/renode/renode"
            codesign --force -s - ${o[@]+"${o[@]}"} --identifier "$2" --entitlements "$4" "$app"
            codesign --verify --strict --verbose=2 "$app" 2>&1 | tail -n 2; }
          fail=0
          run() { # variant app id expect(boot|fail)
            v=$1; app=$2; id=$3; c="$HOME/Library/Containers/$id/Data"; mkdir -p "$R/$v"
            res="$app/Contents/Resources/nuttx"; host="$app/Contents/Resources/renode"
            stack=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["boot"]["stack"])' "$res/state-config.json")
            reset=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["boot"]["reset"])' "$res/state-config.json")
            since=$(date '+%Y-%m-%d %H:%M:%S')
            ( cd "$res" && exec env HOME="$c" TMPDIR="$c/tmp/" DOTNET_DefaultStackSize=0x4000000 \
                RENODE_TLIB_DIRECTORY="$host/tlib" RENODE_SERVER_BIND_ADDRESS=127.0.0.1 \
                "$app/Contents/MacOS/launcher" --disable-gui -P $MON_PORT \
                -e "include @$res/nuttx.resc" -e "sysbus LoadELF @$res/nuttx-user.elf" -e "sysbus LoadELF @$res/nuttx-kernel.elf" \
                -e 'cpu VectorTableOffset 0x08008000' -e "cpu SP $stack" -e "cpu PC $reset" -e 'emulation RunFor "1.0"' \
                -e "include @$res/scripts/spike-state-server.py" -e "spike_state_start \"127.0.0.1\" $STATE_PORT @$res/state-config.json" \
                > "$R/$v/renode.log" 2>&1 ) & pid=$!
            sleep 8; lsof -nP -iTCP -sTCP:LISTEN 2>/dev/null | grep -E ':3955[45]' > "$R/$v/listen.txt"
            python3 "$T/tools/client.py" $STATE_PORT $MON_PORT 240 "$R/$v/client.json" > "$R/$v/client.out" 2>&1; crc=$?
            for i in $(seq 1 30); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            kill -0 $pid 2>/dev/null && { kill -TERM $pid; sleep 3; kill -KILL $pid 2>/dev/null; }
            wait $pid; prc=$?
            pkill -f "apps/$v/SpikeProbe.app" 2>/dev/null; sleep 2
            sudo log show --style compact --start "$since" --predicate 'process == "renode" OR process == "launcher" OR eventMessage CONTAINS "renode(" OR eventMessage CONTAINS "launcher("' 2>/dev/null | head -n 600 > "$R/$v/sandbox-log.txt"
            extracted=$(find "$c/tmp" -name '*translate*' 2>/dev/null | wc -l | tr -d ' ')
            shipped=$(grep -c 'Using shipped translation library' "$R/$v/renode.log")
            anyaddr=$(grep -c '\*:39554\|0.0.0.0:39554' "$R/$v/listen.txt")
            printf '{"variant":"%s","expect":"%s","clientExit":%s,"processExit":%s,"secinitAppSandboxLines":%s,"denyLines":%s,"shippedTlibLines":%s,"extractedTlibFiles":%s,"anyAddressListeners":%s}\n' \
              "$v" "$4" "$crc" "$prc" "$(grep -c 'AppSandbox' "$R/$v/sandbox-log.txt")" "$(grep -c 'deny(' "$R/$v/sandbox-log.txt")" "$shipped" "$extracted" "$anyaddr" | tee "$R/$v/summary.json"
            tail -n 15 "$R/$v/renode.log"; cat "$R/$v/client.out"; cat "$R/$v/listen.txt"; grep 'deny(' "$R/$v/sandbox-log.txt" | head -n 20
            if [ "$4" = boot ]; then [ $crc = 0 ] && [ "$shipped" -ge 1 ] && [ "$extracted" = 0 ] && [ "$anyaddr" = 0 ] || fail=1; fi
          }
          SB=com.apple.security.app-sandbox; NS=com.apple.security.network.server; NC=com.apple.security.network.client
          JIT=com.apple.security.cs.allow-jit; DLV=com.apple.security.cs.disable-library-validation; INH=com.apple.security.inherit
          pc() { id=org.brickwright.probe.$1; a=$(bundle $1 $id); signall "$a" $id "$(ent $1-child $3)" "$(ent $1 $4)" $5; run $1 "$a" $id $2; }
          pc spike-parent-child boot "$SB $INH" "$SB $NS $NC" 0
          pc spike-parent-child-hardened boot "$SB $INH $JIT $DLV" "$SB $NS $NC $JIT $DLV" 1
          # Re-test with loopback-only listeners: is network.server still required?
          pc spike-parent-child-client-only measure "$SB $INH" "$SB $NC" 0
          pc spike-parent-child-no-network measure "$SB $INH" "$SB" 0
          cat "$R"/*/summary.json > "$R/all-summaries.jsonl"; cat "$R/all-summaries.jsonl"
          exit $fail
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sandbox-probe-${{ matrix.rid }}
          path: ${{ runner.temp }}/results
          retention-days: 14
