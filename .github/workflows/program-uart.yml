name: Bounded program UART
on:
  pull_request:
    paths:
      - tools/spike_program_uart.cs
      - tests/tools/program-uart/**
      - .github/workflows/program-uart.yml
  push:
    branches: [main]
    paths:
      - tools/spike_program_uart.cs
      - tests/tools/program-uart/**
      - .github/workflows/program-uart.yml
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/tools/program-uart/ProgramUartTests.csproj --configuration Release -p:UseSharedCompilation=false
