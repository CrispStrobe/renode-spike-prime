name: Bounded program UART
on:
  pull_request:
    paths:
      - tools/spike_program_uart.cs
      - tests/tools/program-uart/**
      - .github/workflows/program-uart.yml
  push:
    branches: [main]
    paths:
      - tools/spike_program_uart.cs
      - tests/tools/program-uart/**
      - .github/workflows/program-uart.yml
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/tools/program-uart/ProgramUartTests.csproj --configuration Release -p:UseSharedCompilation=false
