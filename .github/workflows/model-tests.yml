name: STM32 model tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: model-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stm32-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned submodules
        run: git submodule update --init --recursive --depth 1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Verify the public submodule revision
        shell: bash
        run: |
          expected=$(git ls-tree HEAD src/Infrastructure | awk '{print $3}')
          actual=$(git -C src/Infrastructure rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Infrastructure checkout mismatch: expected $expected, got $actual"
            exit 1
          fi

      - name: Run source-only SPIKE Essential gates
        run: |
          python3 tests/tools/steering_docs_test.py
          python3 tests/platforms/spike-firmware-scenario-manifest-test.py
          grep -Fq 'Run Opaque Scenario    lego-prime-v2' tests/platforms/SPIKE_Unchanged_Firmware.robot
          grep -Fq 'Run Protected Scenario    brickwright-nuttx    true' tests/platforms/SPIKE_Unchanged_Firmware.robot
          grep -Fq 'primeStorage: SPI.GenericSpiFlash' platforms/boards/spike-prime.repl
          tests/platforms/spike-essential-loader-test.sh
          grep -Fq 'imu: Sensors.LSM6DS3TRC @ i2c3 0x6a' platforms/boards/spike-essential.repl
          grep -Fq 'essentialStorage: SPI.GenericSpiFlash' platforms/boards/spike-essential.repl
          grep -Fq 'connector Connect uart5 essentialPortAHub' scripts/single-node/spike-essential.resc
          grep -Fq 'connector Connect usart3 essentialPortBHub' scripts/single-node/spike-essential.resc
          grep -Fq 'fmpi2c1: I2C.STM32F7_I2C @ sysbus 0x40006000' platforms/boards/spike-essential.repl
          grep -Fq 'essentialLeds: I2C.LP50XX @ fmpi2c1 0x28' platforms/boards/spike-essential.repl
          ! grep -Fq 'spike-prime.repl' platforms/boards/spike-essential.repl
          tests/platforms/spike-brick-devices-source-test.sh

      - name: Run source-only Bluetooth controller gates
        run: |
          for test in tests/tools/bluetooth_controller_*_test.py; do
            python3 "$test"
          done
          python3 -m py_compile \
            tools/bluetooth_controller/*.py \
            tools/spike-bluetooth-controller.py \
            tests/tools/bluetooth_controller_*_test.py

      - name: Build native translator libraries
        run: ./build.sh --net --no-gui --external-lib-only

      - name: Run focused STM32 model tests
        shell: bash
        run: |
          project=src/Infrastructure/src/Emulator/Peripherals/Test/PeripheralsTests/PeripheralsTests_NET.csproj
          common=(-p:TargetFrameworks=net8.0 -p:GUI_DISABLED=true -p:CurrentPlatform=Linux)
          dotnet restore "$project" "${common[@]}"
          dotnet test "$project" --configuration Release --no-restore \
            "${common[@]}" \
            --filter 'FullyQualifiedName~STM32DMATests|FullyQualifiedName~STM32SPITests|FullyQualifiedName~STM32_UARTTests|FullyQualifiedName~STM32F7I2CTests|FullyQualifiedName~TLC5955Tests|FullyQualifiedName~LSM6DS3TRCTests|FullyQualifiedName~LP50XXTests|FullyQualifiedName~GenericSpiFlashW25Q256Tests|FullyQualifiedName~LegoLpf2PortTests|FullyQualifiedName~BrickPowerControllerTests|FullyQualifiedName~PCMAudioSinkTests' \
            --logger 'console;verbosity=normal'
