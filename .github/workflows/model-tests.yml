name: STM32 model tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: private-model-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stm32-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned submodules
        run: git submodule update --init --recursive --depth 1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Verify the public submodule revision
        shell: bash
        run: |
          expected=$(git ls-tree HEAD src/Infrastructure | awk '{print $3}')
          actual=$(git -C src/Infrastructure rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Infrastructure checkout mismatch: expected $expected, got $actual"
            exit 1
          fi

      - name: Build native translator libraries
        run: ./build.sh --net --no-gui --external-lib-only

      - name: Run focused STM32 model tests
        shell: bash
        run: |
          project=src/Infrastructure/src/Emulator/Peripherals/Test/PeripheralsTests/PeripheralsTests_NET.csproj
          common=(-p:TargetFrameworks=net8.0 -p:GUI_DISABLED=true -p:CurrentPlatform=Linux)
          dotnet restore "$project" "${common[@]}"
          dotnet test "$project" --configuration Release --no-restore \
            "${common[@]}" \
            --filter 'FullyQualifiedName~STM32DMATests|FullyQualifiedName~STM32SPITests|FullyQualifiedName~STM32_UARTTests|FullyQualifiedName~TLC5955Tests' \
            --logger 'console;verbosity=normal'
