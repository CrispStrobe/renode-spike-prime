name: Renode model tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: model-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stm32-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned submodules
        run: git submodule update --init --recursive --depth 1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Verify the public submodule revision
        shell: bash
        run: |
          expected=$(git ls-tree HEAD src/Infrastructure | awk '{print $3}')
          actual=$(git -C src/Infrastructure rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Infrastructure checkout mismatch: expected $expected, got $actual"
            exit 1
          fi

      # The offline support profile retains its reviewed source closure. A
      # shallow checkout of a newer runtime pin need not contain that commit.
      - name: Fetch the immutable offline profile source reference
        run: git -C src/Infrastructure fetch --depth 1 origin 5d2d3a79ed1df755fc261194de0774960d2ae0d3

      - name: Run source-only SPIKE Essential gates
        run: |
          python3 tests/tools/steering_docs_test.py
          python3 tests/platforms/spike-firmware-scenario-manifest-test.py
          python3 tests/platforms/spike-local-image-test.py
          python3 tests/platforms/spike-micropython-filesystem-test.py
          grep -Fq 'Run Opaque Scenario    lego-prime-v2' tests/platforms/SPIKE_Unchanged_Firmware.robot
          grep -Fq 'Run Protected Scenario    brickwright-nuttx    ${True}' tests/platforms/SPIKE_Unchanged_Firmware.robot
          grep -Fq 'primeStorage: SPI.GenericSpiFlash' platforms/boards/spike-prime.repl
          grep -Fq 'using "../cpus/stm32f413vg.repl"' platforms/boards/spike-prime-brick-devices.repl
          grep -Fq 'size: 0x100000' platforms/cpus/stm32f413vg.repl
          grep -Fq 'systickFrequency: 96000000' platforms/cpus/stm32f413vg.repl
          grep -Fq 'connector Connect uart9 primePortFHub' scripts/single-node/spike-prime.resc
          tests/platforms/spike-essential-loader-test.sh
          grep -Fq 'imu: Sensors.LSM6DS3TRC @ i2c3 0x6a' platforms/boards/spike-essential.repl
          grep -Fq 'essentialStorage: SPI.GenericSpiFlash' platforms/boards/spike-essential.repl
          grep -Fq 'connector Connect uart5 essentialPortAHub' scripts/single-node/spike-essential.resc
          grep -Fq 'connector Connect usart3 essentialPortBHub' scripts/single-node/spike-essential.resc
          grep -Fq 'fmpi2c1: I2C.STM32F7_I2C @ sysbus 0x40006000' platforms/boards/spike-essential.repl
          grep -Fq 'essentialLeds: I2C.LP50XX @ fmpi2c1 0x28' platforms/boards/spike-essential.repl
          ! grep -Fq 'spike-prime.repl' platforms/boards/spike-essential.repl
          tests/platforms/spike-brick-devices-source-test.sh

      - name: Run source-only Bluetooth controller gates
        run: |
          for test in tests/tools/bluetooth_controller_*_test.py; do
            python3 "$test"
          done
          python3 tests/tools/spike_fault_soak_test.py
          python3 tests/tools/spike_fault_resource_soak_test.py
          python3 -m py_compile \
            tools/bluetooth_controller/*.py \
            tools/spike-bluetooth-controller.py \
            tools/spike-fault-resource-soak.py \
            tests/tools/bluetooth_controller_*_test.py

      - name: Run neutral brick-state contract gates
        run: |
          python3 tests/tools/stage_prime_micropython_test.py
          python3 tests/tools/bwspike_api_test.py
          python3 tests/tools/bwspike_readers_test.py
          python3 tools/stage_prime_micropython.py --infrastructure src/Infrastructure --output "$RUNNER_TEMP/prime-micro-support"
          python3 -m unittest discover -s tests/tools -p 'spike_state_bridge_test.py'
          python3 -m unittest discover -s tests/tools -p 'spike_live_state_test.py'
          python3 tests/tools/spike_state_server_clock_test.py
          python3 tests/tools/spike_state_monitor_protocol_test.py
          python3 tests/tools/spike_program_uart_test.py
          python3 tests/tools/spike_flash_checkpoint_test.py
          python3 -m unittest discover -s tests/tools -p 'spike_state_socket_test.py'
          python3 tests/tools/ev3_state_observer_test.py
          python3 tests/tools/spike_arena_mailbox_test.py
          python3 tests/tools/spike_arena_inputs_test.py
          python3 tests/tools/spike_arena_program_test.py
          python3 tests/platforms/spike-nuttx-mailbox-test.py
          python3 -m json.tool contracts/brick-state/v1/schema.json >/dev/null
          python3 -m py_compile tools/spike_state_bridge.py tools/spike-state-bridge.py

      - name: Run source-only EV3 control gates
        shell: bash
        run: |
          grep -Fq 'psc0: Miscellaneous.TI_DA8xx_PSC @ sysbus 0x01C10000' platforms/cpus/am1808.repl
          grep -Fq 'pll0: Miscellaneous.TI_DA8xx_PLLC @ sysbus 0x01C11000' platforms/cpus/am1808.repl
          grep -Fq 'syscfg0: Miscellaneous.TI_DA8xx_SYSCFG0 @ sysbus 0x01C14000' platforms/cpus/am1808.repl
          test "$(grep -Fc 'postBootloaderState: true' platforms/cpus/am1808.repl)" = 5
          grep -Fq 'SPDX-License-Identifier: MIT' tests/platforms/LEGO_EV3/am1808-control-smoke.S
          grep -Fq 'edma0cc: DMA.TI_DA8xx_EDMA3CC @ sysbus 0x01C00000' platforms/cpus/am1808.repl
          grep -Fq 'edma0tc0: DMA.TI_DA8xx_EDMA3TC @ sysbus 0x01C08000' platforms/cpus/am1808.repl
          grep -Fq 'edma0tc1: DMA.TI_DA8xx_EDMA3TC @ sysbus 0x01C08400' platforms/cpus/am1808.repl
          grep -Fq 'edma1cc: DMA.TI_DA8xx_EDMA3CC @ sysbus 0x01E30000' platforms/cpus/am1808.repl
          grep -Fq 'edma1tc0: DMA.TI_DA8xx_EDMA3TC @ sysbus 0x01E38000' platforms/cpus/am1808.repl
          grep -Fq 'AttachTransferController edma0tc0 0' platforms/cpus/am1808.repl
          grep -Fq 'AttachTransferController edma0tc1 1' platforms/cpus/am1808.repl
          grep -Fq 'AttachTransferController edma1tc0 0' platforms/cpus/am1808.repl
          grep -Fq 'SPDX-License-Identifier: MIT' tests/platforms/LEGO_EV3/am1808-edma-smoke.S
          grep -Fq 'EV3 EDMA FAIL DATA' tests/platforms/LEGO_EV3/am1808-edma-smoke.S
          grep -Fq 'mmcsd0: SD.TI_DA8xx_MMCSD @ sysbus 0x01C40000' platforms/cpus/am1808.repl
          grep -Fq 'IRQ -> aintc@16' platforms/cpus/am1808.repl
          grep -Fq 'SDIOIRQ -> aintc@17' platforms/cpus/am1808.repl
          grep -Fq 'RxDMARequest -> edma0cc@16' platforms/cpus/am1808.repl
          grep -Fq 'TxDMARequest -> edma0cc@17' platforms/cpus/am1808.repl
          if grep -Fq 'mmcsd1:' platforms/cpus/am1808.repl; then
            echo '::error::EV3 must not wire disabled MMC/SD1'
            exit 1
          fi
          grep -Fq 'SPDX-License-Identifier: MIT' tests/platforms/LEGO_EV3/am1808-mmc-smoke.S
          grep -Fq 'EV3 MMC FAIL NBLC' tests/platforms/LEGO_EV3/am1808-mmc-smoke.S
          grep -Fq 'EV3 MMC FAIL POWER' tests/platforms/LEGO_EV3/am1808-mmc-smoke.S
          grep -Fq 'SPDX-License-Identifier: MIT' tests/platforms/LEGO_EV3/generate-am1808-sd-image.py
          grep -Fq 'gpio: GPIOPort.TI_DA8xx_GPIO @ sysbus 0x01E26000' platforms/cpus/am1808.repl
          bank=0
          for event in 42 43 44 45 46 47 48 49 50; do
            grep -Fq "Bank${bank}IRQ -> aintc@$event" platforms/cpus/am1808.repl
            bank=$((bank + 1))
          done
          grep -Fq '43 -> ev3Lcd@1' platforms/boards/lego-ev3.repl
          grep -Fq '44 -> ev3Lcd@0' platforms/boards/lego-ev3.repl
          grep -Fq '80 -> ev3Lcd@2' platforms/boards/lego-ev3.repl
          grep -Fq 'SPDX-License-Identifier: MIT' tests/platforms/LEGO_EV3/am1808-gpio-smoke.S
          grep -Fq 'EV3 GPIO FAIL PINMUX' tests/platforms/LEGO_EV3/am1808-gpio-smoke.S
          grep -Fq 'spi1: SPI.TI_DA8xx_SPI @ sysbus 0x01F0E000' platforms/cpus/am1808.repl
          grep -Fq 'IRQ -> aintc@56' platforms/cpus/am1808.repl
          grep -Fq 'ev3Lcd: Video.ST7586 @ spi1 0' platforms/boards/lego-ev3.repl
          grep -Fq 'SPDX-License-Identifier: MIT' tests/platforms/LEGO_EV3/am1808-spi-display-smoke.S
          grep -Fq 'EV3 SPI DISPLAY FAIL IRQ' tests/platforms/LEGO_EV3/am1808-spi-display-smoke.S

      - name: Build native translator libraries
        run: ./build.sh --net --no-gui --external-lib-only

      - name: Build source-only headless Renode
        run: ./build.sh --net --no-gui --skip-fetch

      - name: Run focused STM32 and AM1808 model tests
        shell: bash
        run: |
          project=src/Infrastructure/src/Emulator/Peripherals/Test/PeripheralsTests/PeripheralsTests_NET.csproj
          # build.sh generated the root net8 target; analyzer projects retain
          # their own netstandard2.0 target instead of inheriting a global TFM.
          common=(-p:GUI_DISABLED=true -p:CurrentPlatform=Linux -p:NET=true)
          # The solution built PeripheralsTests and the runtime together.
          dotnet test "$project" --configuration Release --no-build --no-restore \
            "${common[@]}" \
            --filter 'FullyQualifiedName~STM32CRCTests|FullyQualifiedName~STM32DMATests|FullyQualifiedName~STM32SPITests|FullyQualifiedName~STM32SPIDmaReadTests|FullyQualifiedName~STM32_UARTTests|FullyQualifiedName~STM32F7I2CTests|FullyQualifiedName~TLC5955Tests|FullyQualifiedName~LSM6DS3TRCTests|FullyQualifiedName~LP50XXTests|FullyQualifiedName~GenericSpiFlashW25Q256Tests|FullyQualifiedName~LegoLpf2PortTests|FullyQualifiedName~LegoLpf2ElectricalPortTests|FullyQualifiedName~STM32TLCClockTests|FullyQualifiedName~STM32F4I2CStreamTests|FullyQualifiedName~STM32ADCTriggerTests|FullyQualifiedName~BrickPowerControllerTests|FullyQualifiedName~PCMAudioSinkTests|FullyQualifiedName~SpikeFaultSoakTests|FullyQualifiedName~PrimeButtonLadderTests|FullyQualifiedName~STM32TimerBoardClockTests|FullyQualifiedName~STM32TimerRolloverTests|FullyQualifiedName~STM32TimerSoftwareEventTests|FullyQualifiedName~STM32TimerInclusivePeriodTests|FullyQualifiedName~TI_DA8xx_AINTCTests|FullyQualifiedName~TI_DA8xx_Timer64Tests|FullyQualifiedName~TI_DA8xx_PSCTests|FullyQualifiedName~TI_DA8xx_PLLCTests|FullyQualifiedName~TI_DA8xx_SYSCFG0Tests|FullyQualifiedName~TI_DA8xx_EDMA3CCTests|FullyQualifiedName~TI_DA8xx_EDMA3TCTests|FullyQualifiedName~TI_DA8xx_MMCSDTests|FullyQualifiedName~TI_DA8xx_GPIOTests|FullyQualifiedName~TI_DA8xx_SPITests|FullyQualifiedName~ST7586Tests' \
            --logger 'console;verbosity=normal'

      - name: Run redirected console input tests
        run: |
          dotnet test src/Infrastructure/src/Emulator/Main/Tests/UnitTests/UnitTests_NET.csproj \
            --configuration Release --no-build --no-restore \
            -p:GUI_DISABLED=true -p:CurrentPlatform=Linux -p:NET=true \
            --filter 'FullyQualifiedName~ConsoleIOSourceTests' \
            --logger 'console;verbosity=normal'

      - name: Run focused EV3 analog and motor model tests
        run: |
          dotnet test src/Infrastructure/src/Emulator/Peripherals/Test/PeripheralsTests/PeripheralsTests_NET.csproj \
            --configuration Release --no-build --no-restore \
            -p:GUI_DISABLED=true -p:CurrentPlatform=Linux -p:NET=true \
            --filter 'FullyQualifiedName~ADS7957Tests|FullyQualifiedName~TI_DA8xx_EHRPWMTests|FullyQualifiedName~TI_DA8xx_ECAPTests|FullyQualifiedName~PWMDrivenMotorTests' \
            --logger 'console;verbosity=normal'

      - name: Build the permissive target qualification images
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
          cd tests/platforms/LEGO_EV3
          arm-none-eabi-gcc -mcpu=arm926ej-s -nostdlib \
            -Wl,-T,am1808-smoke.ld -o am1808-smoke.elf am1808-smoke.S
          test "$(arm-none-eabi-readelf -h am1808-smoke.elf | awk '/Entry point/{print $4}')" = 0xffff0000
          arm-none-eabi-gcc -mcpu=arm926ej-s -nostdlib \
            -Wl,-T,am1808-smoke.ld -o am1808-timer64-smoke.elf am1808-timer64-smoke.S
          test "$(arm-none-eabi-readelf -h am1808-timer64-smoke.elf | awk '/Entry point/{print $4}')" = 0xffff0000
          arm-none-eabi-gcc -mcpu=arm926ej-s -nostdlib \
            -Wl,-T,am1808-smoke.ld -o am1808-control-smoke.elf am1808-control-smoke.S
          test "$(arm-none-eabi-readelf -h am1808-control-smoke.elf | awk '/Entry point/{print $4}')" = 0xffff0000
          arm-none-eabi-gcc -mcpu=arm926ej-s -nostdlib \
            -Wl,-T,am1808-smoke.ld -o am1808-edma-smoke.elf am1808-edma-smoke.S
          test "$(arm-none-eabi-readelf -h am1808-edma-smoke.elf | awk '/Entry point/{print $4}')" = 0xffff0000
          arm-none-eabi-gcc -mcpu=arm926ej-s -nostdlib \
            -Wa,-defsym,EDMA_HW16=1 -Wl,-T,am1808-smoke.ld \
            -o am1808-edma-hw16-smoke.elf am1808-edma-smoke.S
          test "$(arm-none-eabi-readelf -h am1808-edma-hw16-smoke.elf | awk '/Entry point/{print $4}')" = 0xffff0000
          arm-none-eabi-gcc -mcpu=arm926ej-s -nostdlib \
            -Wl,-T,am1808-smoke.ld -o am1808-mmc-pio-smoke.elf am1808-mmc-smoke.S
          test "$(arm-none-eabi-readelf -h am1808-mmc-pio-smoke.elf | awk '/Entry point/{print $4}')" = 0xffff0000
          arm-none-eabi-gcc -mcpu=arm926ej-s -nostdlib \
            -Wa,-defsym,MMC_EDMA=1 -Wl,-T,am1808-smoke.ld \
            -o am1808-mmc-edma-smoke.elf am1808-mmc-smoke.S
          test "$(arm-none-eabi-readelf -h am1808-mmc-edma-smoke.elf | awk '/Entry point/{print $4}')" = 0xffff0000
          arm-none-eabi-gcc -mcpu=arm926ej-s -nostdlib \
            -Wl,-T,am1808-smoke.ld -o am1808-gpio-smoke.elf am1808-gpio-smoke.S
          test "$(arm-none-eabi-readelf -h am1808-gpio-smoke.elf | awk '/Entry point/{print $4}')" = 0xffff0000
          arm-none-eabi-gcc -mcpu=arm926ej-s -nostdlib \
            -Wl,-T,am1808-smoke.ld -o am1808-spi-display-smoke.elf am1808-spi-display-smoke.S
          test "$(arm-none-eabi-readelf -h am1808-spi-display-smoke.elf | awk '/Entry point/{print $4}')" = 0xffff0000
          for name in adc motor; do
            arm-none-eabi-gcc -mcpu=arm926ej-s -nostdlib \
              -Wl,-T,am1808-smoke.ld -o "am1808-$name-smoke.elf" "am1808-$name-smoke.S"
            test "$(arm-none-eabi-readelf -h "am1808-$name-smoke.elf" | awk '/Entry point/{print $4}')" = 0xffff0000
          done
          python3 generate-am1808-sd-image.py /tmp/ev3-am1808-sd.img
          test "$(stat -c '%s' /tmp/ev3-am1808-sd.img)" = 1048576
          test "$(sha256sum /tmp/ev3-am1808-sd.img | awk '{print $1}')" = 8e8b458d4c0b8ee96c726f78962fd63fb109f78b1dc073da15a8fc53df28c637
          cd ../SPIKE_Prime
          arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -nostdlib \
            -Wl,-T,stm32f413-throughput.ld -o stm32f413-throughput.elf \
            stm32f413-throughput.S
          test "$(arm-none-eabi-readelf -h stm32f413-throughput.elf | awk '/Entry point/{print $4}')" = 0x8000009

      - name: Load the source-only SPIKE Prime platform
        run: tests/platforms/spike-prime-platform-load-test.sh

      - name: Execute the EV3 ARM9 UART and IRQ path
        shell: bash
        run: |
          uart_log=/tmp/ev3-arm9-uart.log
          rm -f "$uart_log"
          timeout 120s dotnet output/bin/Release/Renode.dll --disable-gui --plain -e \
            'mach create; machine LoadPlatformDescription @platforms/boards/lego-ev3.repl; sysbus LoadELF @tests/platforms/LEGO_EV3/am1808-smoke.elf; uart1 CreateFileBackend @/tmp/ev3-arm9-uart.log true; emulation RunFor "0.01"; q'
          test "$(cat "$uart_log")" = "EV3 ARM9 IRQ"

      - name: Execute the EV3 Timer64P0 interrupt path
        shell: bash
        run: |
          uart_log=/tmp/ev3-timer64-uart.log
          rm -f "$uart_log"
          timeout 120s dotnet output/bin/Release/Renode.dll --disable-gui --plain -e \
            'mach create; machine LoadPlatformDescription @platforms/boards/lego-ev3.repl; sysbus LoadELF @tests/platforms/LEGO_EV3/am1808-timer64-smoke.elf; uart1 CreateFileBackend @/tmp/ev3-timer64-uart.log true; emulation RunFor "0.05"; q'
          test "$(cat "$uart_log")" = "EV3 TIMER64 IRQ"

      - name: Execute the EV3 post-EEPROM control handoff
        shell: bash
        run: |
          uart_log=/tmp/ev3-control-uart.log
          receipt=/tmp/ev3-control-receipt.json
          rm -f "$uart_log" "$receipt"
          timeout 120s dotnet output/bin/Release/Renode.dll --disable-gui --plain -e \
            'mach create; machine LoadPlatformDescription @platforms/boards/lego-ev3.repl; sysbus LoadELF @tests/platforms/LEGO_EV3/am1808-control-smoke.elf; uart1 CreateFileBackend @/tmp/ev3-control-uart.log true; emulation RunFor "0.01"; q'
          test "$(cat "$uart_log")" = "EV3 PSC PLL PINMUX OK"
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = {
              "schema": "brickwright.ev3.am1808-control.v1",
              "platform": "platforms/boards/lego-ev3.repl",
              "payload": "MIT source-built ARM926EJ-S",
              "boundary": "explicit post-EEPROM preset; no boot ROM/EEPROM binary",
              "proofs": [
                  "PSC0 module 6 enabled-syncreset-enabled transition",
                  "PLLC0 divider GOSET transition and restore",
                  "SYSCFG0 rev2.2 KICK no-op, pinmux/suspend/config mutation and restore",
              ],
              "uart": Path("/tmp/ev3-control-uart.log").read_text().rstrip("\n"),
          }
          Path("/tmp/ev3-control-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload EV3 AM1808 control receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ev3-am1808-control
          path: /tmp/ev3-control-receipt.json

      - name: Execute the EV3 EDMA software and hardware event paths
        shell: bash
        run: |
          software_log=/tmp/ev3-edma-software-uart.log
          hardware_log=/tmp/ev3-edma-hw16-uart.log
          receipt=/tmp/ev3-edma-receipt.json
          rm -f "$software_log" "$hardware_log" "$receipt"
          timeout 120s dotnet output/bin/Release/Renode.dll --disable-gui --plain -e \
            'mach create; machine LoadPlatformDescription @platforms/boards/lego-ev3.repl; sysbus LoadELF @tests/platforms/LEGO_EV3/am1808-edma-smoke.elf; uart1 CreateFileBackend @/tmp/ev3-edma-software-uart.log true; emulation RunFor "0.02"; q'
          test "$(cat "$software_log")" = "EV3 EDMA IRQ"
          timeout 120s dotnet output/bin/Release/Renode.dll --disable-gui --plain -e \
            'mach create; machine LoadPlatformDescription @platforms/boards/lego-ev3.repl; sysbus LoadELF @tests/platforms/LEGO_EV3/am1808-edma-hw16-smoke.elf; uart1 CreateFileBackend @/tmp/ev3-edma-hw16-uart.log true; edma0cc OnGPIO 16 true; edma0cc OnGPIO 16 false; emulation RunFor "0.02"; q'
          test "$(cat "$hardware_log")" = "EV3 EDMA HW16 IRQ"
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = {
              "schema": "brickwright.ev3.am1808-edma.v1",
              "platform": "platforms/boards/lego-ev3.repl",
              "payload": "MIT source-built ARM926EJ-S",
              "timing_model": "functional immediate; not cycle accurate",
              "proofs": [
                  "EDMA0 software channel 0 copies 16 bytes",
                  "EDMA0 hardware channel 16 latches the MMC/SD0 RX request before EER and drains it on EESR",
                  "completion TCC raises physical AINTC system event 11",
                  "IRQ handler clears IPR/ICR and validates copied data",
              ],
              "software_uart": Path("/tmp/ev3-edma-software-uart.log").read_text().rstrip("\n"),
              "hardware_uart": Path("/tmp/ev3-edma-hw16-uart.log").read_text().rstrip("\n"),
          }
          Path("/tmp/ev3-edma-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload EV3 AM1808 EDMA receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ev3-am1808-edma
          path: /tmp/ev3-edma-receipt.json

      - name: Execute the EV3 MMC PIO and EDMA read paths
        shell: bash
        run: |
          pio_log=/tmp/ev3-mmc-pio-uart.log
          edma_log=/tmp/ev3-mmc-edma-uart.log
          receipt=/tmp/ev3-mmc-receipt.json
          rm -f "$pio_log" "$edma_log" "$receipt"
          timeout 120s dotnet output/bin/Release/Renode.dll --disable-gui --plain -e \
            'mach create; machine LoadPlatformDescription @platforms/boards/lego-ev3.repl; machine SdCardFromFile @/tmp/ev3-am1808-sd.img mmcsd0 0x100000 false "ev3Sd"; sysbus LoadELF @tests/platforms/LEGO_EV3/am1808-mmc-pio-smoke.elf; uart1 CreateFileBackend @/tmp/ev3-mmc-pio-uart.log true; emulation RunFor "0.03"; q'
          test "$(cat "$pio_log")" = "EV3 MMC PIO READ OK"
          timeout 120s dotnet output/bin/Release/Renode.dll --disable-gui --plain -e \
            'mach create; machine LoadPlatformDescription @platforms/boards/lego-ev3.repl; machine SdCardFromFile @/tmp/ev3-am1808-sd.img mmcsd0 0x100000 false "ev3Sd"; sysbus LoadELF @tests/platforms/LEGO_EV3/am1808-mmc-edma-smoke.elf; uart1 CreateFileBackend @/tmp/ev3-mmc-edma-uart.log true; emulation RunFor "0.03"; q'
          test "$(cat "$edma_log")" = "EV3 MMC EDMA READ OK"
